name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repositoriyi Klonla
      uses: actions/checkout@v4

    - name: Java 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Gradle Yetkisi Ver
      run: chmod +x gradlew || true

    - name: Fabric Modunu Derle (Gradle Build)
      uses: gradle/gradle-build-action@v3
      with:
        arguments: build

    - name: JAR Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Bluetooth-Mod
        path: build/libs/*.jar