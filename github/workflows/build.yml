name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repositoriyi Klonla
      uses: actions/checkout@v4

    - name: Java 21 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fabric Modunu Derle
      run: gradle build

    - name: JAR Dosyasını Çıktı Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Bluetooth-Mod
        path: build/libs/*.jar

